name: Feature request
description: Propose a concrete improvement for Soroban event ingestion or decoding.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation are you encountering, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the API or behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Soroban use case
      description: Explain how this helps an application, indexer, or event consumer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      validations:
        required: false

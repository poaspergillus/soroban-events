name: Bug report
description: Report a reproducible defect in soroban-events.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |-
        Please search existing issues first. Never include private keys, RPC credentials, or sensitive production data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample or test case that reproduces the problem.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
      placeholder: "Node.js 22.12.0, Arch Linux"
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: soroban-events version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact RPC URLs containing credentials, tokens, account identifiers, and private data.
      render: text
    validations:
      required: false
